name: NAVI Core CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python -m pip check
      - name: Require toolchain
        run: |
          node --version
          cmake --version
          ctest --version
          git --version
          npm --version
      - run: python -m unittest discover -s tests -v
      - name: Offline benchmark reference smoke
        run: navi bench --mode reference
      - name: Installed CLI outside source tree
        working-directory: ${{ runner.temp }}
        run: navi doctor
  reusable-smoke:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      core_sha: ${{ github.sha }}
