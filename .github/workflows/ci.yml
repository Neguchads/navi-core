name: NAVI Core CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python -m pip check
      - name: Require toolchain
        run: |
          node --version
          cmake --version
          ctest --version
          git --version
          npm --version
      - run: python -m unittest discover -s tests -v
      - name: Offline benchmark reference smoke
        run: navi bench --mode reference
      - name: Read-only foundation smoke
        run: |
          navi providers
          navi sentinel --root .
          navi public-status
      - name: Installed CLI outside source tree
        working-directory: ${{ runner.temp }}
        run: navi doctor
  reusable-smoke:
    uses: $/.github/workflows/reusable-ci.yml
    with:
      core_sha: ${{ github.sha }}
  sentinel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Workflow static analysis
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3
        with:
          version: '1.32.0'
          strict-collection: true
          advanced-security: false
          online-audits: false
      - name: Scan pinned Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-ci.txt
          no-deps: true
      - name: Scan Git history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl --fail --silent --show-error --location --max-time 120 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$tmp/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          "$tmp/gitleaks" git --redact --no-banner --log-opts="--all" .
  public-artifacts:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, reusable-smoke, sentinel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - name: Build wheel and public synthetic metrics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/navi-public"
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/navi-public"
          navi public-status --output "$RUNNER_TEMP/navi-public/core-status.json"
          cd "$RUNNER_TEMP/navi-public"
          sha256sum ./*.whl core-status.json > MANIFEST.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: navi-core-public
          path: ${{ runner.temp }}/navi-public
          if-no-files-found: error
          retention-days: 7
