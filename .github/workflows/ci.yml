name: NAVI Core CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python -m pip check
      - name: Require toolchain
        run: |
          node --version
          cmake --version
          ctest --version
          git --version
          npm --version
      - run: python -m unittest discover -s tests -v
      - name: Offline benchmark reference smoke
        run: navi bench --mode reference
      - name: Read-only foundation smoke
        run: |
          navi providers
          navi sentinel --root .
          navi public-status
      - name: Installed CLI outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          navi doctor
          navi hosts
          navi capabilities --host generic
          navi standard --profile game-recomp
          navi assist --profile documentation --format markdown
  mcp-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-build-isolation ".[mcp]"
      - run: python -m pip check
      - run: python scripts/mcp_smoke.py
  reusable-smoke:
    uses: $/.github/workflows/reusable-ci.yml
    with:
      core_sha: ${{ github.sha }}
  sentinel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Workflow static analysis
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3
        with:
          version: '1.32.0'
          strict-collection: true
          advanced-security: false
          online-audits: false
      - name: Scan pinned Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-ci.txt
          no-deps: true
      - name: Scan Git history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl --fail --silent --show-error --location --max-time 120 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$tmp/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          "$tmp/gitleaks" git --redact --no-banner --log-opts="--all" .
  public-artifacts:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, reusable-smoke, sentinel, mcp-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - name: Build wheel and public synthetic metrics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/navi-public"
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/navi-public"
          navi public-status --output "$RUNNER_TEMP/navi-public/core-status.json"
          cd "$RUNNER_TEMP/navi-public"
          sha256sum ./*.whl core-status.json > MANIFEST.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: navi-core-public
          path: ${{ runner.temp }}/navi-public
          if-no-files-found: error
          retention-days: 7
  attest-public-artifacts:
    if: github.repository == 'Neguchads/navi-core' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [public-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: navi-core-public
          path: ${{ runner.temp }}/navi-public
      - name: Verify artifact checksums
        shell: bash
        working-directory: ${{ runner.temp }}/navi-public
        run: sha256sum --check MANIFEST.sha256
      - name: Attest public wheel and metrics
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/navi-public/*.whl
            ${{ runner.temp }}/navi-public/core-status.json
      - name: Verify published provenance
        shell: bash
        working-directory: ${{ runner.temp }}/navi-public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wheel in ./*.whl; do
            gh attestation verify "$wheel" --repo Neguchads/navi-core
          done
          gh attestation verify core-status.json --repo Neguchads/navi-core
  verify-wheel:
    if: github.repository == 'Neguchads/navi-core' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [attest-public-artifacts]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: navi-core-public
          path: ${{ runner.temp }}/navi-public
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Verify artifact signature
        shell: bash
        working-directory: ${{ runner.temp }}/navi-public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check MANIFEST.sha256
          for wheel in ./*.whl; do gh attestation verify "$wheel" --repo Neguchads/navi-core; done
      - name: Fresh installation of downloaded wheel
        working-directory: ${{ runner.temp }}/navi-public
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/navi-wheel-venv"
          if [ -f "$RUNNER_TEMP/navi-wheel-venv/bin/python" ]; then py="$RUNNER_TEMP/navi-wheel-venv/bin/python"; else py="$RUNNER_TEMP/navi-wheel-venv/Scripts/python.exe"; fi
          "$py" -m pip install ./*.whl
          "$py" -m pip check
          "$py" -I -m navi_core --version
          "$py" -I -m navi_core bench --mode reference
          "$py" -I -m navi_core providers
          canonical_temp=$(cd "$RUNNER_TEMP" && pwd -P)
          for host in codex claude gemini copilot; do
            "$py" -I -m navi_core host-lab --mode prepare --host "$host" --directory "$canonical_temp/navi-host-lab-$host"
          done
          mkdir -p "$canonical_temp/navi-zero-ai"
          printf "# Zero AI fixture\n" > "$canonical_temp/navi-zero-ai/README.md"
          "$py" -I -m navi_core init --root "$canonical_temp/navi-zero-ai" --profile documentation --visibility public --host none
          "$py" -I -m navi_core verify --root "$canonical_temp/navi-zero-ai" --execute
          "$py" -I -m navi_core hosts
          "$py" -I -m navi_core capabilities --host generic
          "$py" -I -m navi_core standard --profile game-recomp
          "$py" -I -m navi_core assist --profile game-recomp --format markdown
          "$py" -I -m navi_core scaffold --root "$canonical_temp/navi-zero-ai" --apply
          "$py" -I -m navi_core audit --root "$canonical_temp/navi-zero-ai"
          "$py" -I -m navi_core copilot-plan --kind lint --risk low --visibility public --files 1 --lines 5
  publish-preview:
    if: github.repository == 'Neguchads/navi-core' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify-wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: navi-core-public
          path: ${{ runner.temp }}/navi-public
      - name: Publish immutable-by-policy preview version
        shell: bash
        working-directory: ${{ runner.temp }}/navi-public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wheel=navi_engineering_core-0.4.0rc1-py3-none-any.whl
          if [ ! -f "$wheel" ]; then echo "Not the requested preview version"; exit 0; fi
          sha256sum --check MANIFEST.sha256
          gh attestation verify "$wheel" --repo Neguchads/navi-core
          if gh release view v0.4.0rc1 --repo Neguchads/navi-core >/dev/null 2>&1; then
            echo "Preview already exists; refusing overwrite"
            exit 0
          fi
          gh release create v0.4.0rc1 "$wheel" MANIFEST.sha256 core-status.json --repo Neguchads/navi-core --target "$GITHUB_SHA" --prerelease --title "NAVI Core 0.4.0rc1 — functional preview" --notes "Signed Core preview; Linux, Windows and macOS wheel installation, security gates, synthetic reference, separate host lab preparation and zero-AI fixture passed. Includes provider-independent adapters, NEF reference profiles, roadmap/handoff, additive scaffolding, reviewed local learning, portable agent context and optional SDK-backed MCP. Not a stable production release. Nexus, durable backups, agent/skill acceptance and rollout remain separate gates."
