name: NAVI AutoVerify (final Recomp release artifact)
on:
  workflow_call:
    inputs:
      core_sha:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      filename:
        required: true
        type: string
      expected_sha256:
        required: true
        type: string
      final_delivery:
        required: true
        type: boolean
      approved_public_noncommercial:
        required: true
        type: boolean
    secrets:
      VT_API_KEY:
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: navi-autoverify-public
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate trusted caller inputs
        shell: bash
        env:
          FINAL: ${{ inputs.final_delivery }}
          REPO: ${{ github.repository }}
          EXPECTED: ${{ inputs.expected_sha256 }}
          APPROVED: ${{ inputs.approved_public_noncommercial }}
          PRIVATE: ${{ github.event.repository.private }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CORE_SHA: ${{ inputs.core_sha }}
          FILE_NAME: ${{ inputs.filename }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          [[ "$APPROVED" == "true" && "$PRIVATE" == "false" && "$FINAL" == "true" ]]
          case "$REPO" in
            Neguchads/cdos-nintendods-recomp|Neguchads/csotn-saturn-recomp|Neguchads/ccod-xbox-recomp) ;;
            *) exit 2 ;;
          esac
          [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EVENT" == "workflow_dispatch" || "$EVENT" == "push" ]]
          [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FILE_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$ ]]
          [[ "$ARTIFACT_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Neguchads/navi-core
          ref: ${{ inputs.core_sha }}
          path: reviewed-core
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/navi-scan-input
      - name: Lookup one public artifact by SHA-256
        shell: bash
        env:
          FILE_NAME: ${{ inputs.filename }}
          EXPECTED: ${{ inputs.expected_sha256 }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          python3 -I reviewed-core/navi_core/autoverify.py "$RUNNER_TEMP/navi-scan-input/$FILE_NAME" --expected-sha256 "$EXPECTED" --lookup-public-noncommercial > "$RUNNER_TEMP/navi-autoverify.json"
      - name: Preserve report even when review is required
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: navi-autoverify-${{ github.run_id }}-${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/navi-autoverify.json
          if-no-files-found: error
          retention-days: 7
