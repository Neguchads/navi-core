name: Experimental live Ollama benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-ollama-bench.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-ollama-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    if: github.repository == 'Neguchads/navi-core' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - name: Download verified Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ollama-runtime" "$RUNNER_TEMP/live-bench"
          curl --fail --silent --show-error --location --retry 2 --max-time 420 https://github.com/ollama/ollama/releases/download/v0.40.18/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          printf '%s  %s\n' 'b82649006cb5b54ed1237fa2d1a26a7f939a4fd03150033759acbff7ff315adf' "$RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama-runtime"
      - name: Run actual local CPU inference
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/ollama-models"
          export PATH="$RUNNER_TEMP/ollama-runtime/bin:$PATH"
          export CUDA_VISIBLE_DEVICES=-1
          ollama serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/version; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/version > "$RUNNER_TEMP/live-bench/runtime.json"
          timeout 360 ollama pull qwen2.5:1.5b-instruct-q4_K_M
          curl -fsS http://127.0.0.1:11434/api/tags > "$RUNNER_TEMP/live-bench/model.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert any(m["name"]=="qwen2.5:1.5b-instruct-q4_K_M" and m["digest"].startswith("65ec06548149") for m in d["models"]), "model tag changed"' "$RUNNER_TEMP/live-bench/model.json"
          timeout 360 navi compare --model qwen2.5:1.5b-instruct-q4_K_M --case BENCH-DAG-001 --trials 1 --max-output-tokens 256 --timeout 120 --execute --output "$RUNNER_TEMP/live-bench/comparison.json"
      - name: Upload actual synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-ollama-synthetic-evidence
          path: ${{ runner.temp }}/live-bench
          if-no-files-found: error
          retention-days: 7
